services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: asterum-backend
    ports:
      - "8080:8080"
    volumes:
      - scheduler-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/teams"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: asterum-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  scheduler-data:
